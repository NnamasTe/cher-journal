<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>cher journal</title>
  <link rel="icon" type="image/png" sizes="40x40" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/base.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Patrick+Hand&display=swap">  <link rel="stylesheet" href="/journal.css">
</head>
<body class="tela-journal">

  <div class="cena" id="cena">
    <div class="palco" id="palco">

      <img class="cena-img" src="/journal-cena.png" width="1366" height="768" alt="" draggable="false">

      <main class="folhas" id="folhas" aria-label="páginas do journal">
        <span class="numero numero-esq" id="numEsq">1</span>
        <span class="numero numero-dir" id="numDir">2</span>
        <span class="data-folha" id="dataFolha"></span>
      </main>

      <div class="caixa-folha texto-esq" id="caixaEsq">
        <div class="colisao" id="colEsq" aria-hidden="true"></div>
        <div class="texto-folha" id="textoEsq" contenteditable="false" spellcheck="false"
             role="textbox" aria-multiline="true" aria-label="folha da esquerda"></div>
      </div>
      <div class="caixa-folha texto-dir" id="caixaDir">
        <div class="colisao" id="colDir" aria-hidden="true"></div>
        <div class="texto-folha" id="textoDir" contenteditable="false" spellcheck="false"
             role="textbox" aria-multiline="true" aria-label="folha da direita"></div>
      </div>
      <span class="aviso-folha" id="avisoFolha" role="status" aria-live="polite" hidden></span>

      <div class="adesivos-camada" id="adCamada"></div>

      <button class="item seta seta-esq" id="btnVoltar" type="button" aria-label="voltar folha"></button>
      <button class="item seta seta-dir" id="btnAvancar" type="button" aria-label="avançar folha"></button>

      <button class="item" id="btnEstante" type="button" aria-label="estante"
              style="left:9px;top:7px;width:100px;height:30px"></button>
      <button class="item" id="btnSalvar" type="button" aria-label="salvar"
              style="left:117px;top:7px;width:88px;height:30px"></button>

      <button class="item" id="btnEscrever" type="button" aria-label="escrever"
              style="left:0px;top:98px;width:206px;height:80px"></button>
      <button class="item" id="btnCores" type="button" aria-label="cores"
              style="left:0px;top:196px;width:92px;height:330px"></button>
      <button class="item" id="btnTipos" type="button" aria-label="tipos de folha"
              style="left:0px;top:700px;width:150px;height:68px"></button>

      <button class="item" id="btnAdesivos" type="button" aria-label="adesivos"
              style="left:1166px;top:31px;width:200px;height:80px"></button>
      <button class="item" id="btnApagar" type="button" aria-label="apagar adesivo"
              style="left:1226px;top:150px;width:140px;height:100px"></button>
      <button class="item" id="btnAnotacoes" type="button" aria-label="anotações"
              style="left:1121px;top:439px;width:245px;height:328px;clip-path:polygon(76px 0px, 245px 45px, 245px 328px, 69px 328px, 0px 311px)"></button>

      <div class="gizes" id="gizes" hidden>
        <button class="giz" type="button" data-cor="azul" aria-label="azul" style="top:212px;height:46px"></button>
        <button class="giz" type="button" data-cor="rosa" aria-label="rosa" style="top:258px;height:46px"></button>
        <button class="giz" type="button" data-cor="amarelo" aria-label="amarelo" style="top:304px;height:44px"></button>
        <button class="giz" type="button" data-cor="laranja" aria-label="laranja" style="top:348px;height:44px"></button>
        <button class="giz" type="button" data-cor="marrom" aria-label="marrom" style="top:392px;height:43px"></button>
        <button class="giz" type="button" data-cor="verde" aria-label="verde-água" style="top:435px;height:44px"></button>
        <button class="giz" type="button" data-cor="preto" aria-label="preto" style="top:479px;height:47px"></button>
        <svg class="estrela" id="estrela" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" hidden>
          <path d="M12 1.8l2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.1l7.1-.7z"/>
        </svg>
        <button class="gizes-ok" id="btnOkCores" type="button" aria-label="ok">ok</button>
      </div>

      <div class="papeis" id="papeis" role="dialog" aria-label="tipos de folha" hidden>
        <div class="papeis-fundo"></div>
        <svg class="papeis-folhas" viewBox="0 0 1366 768" width="1366" height="768" aria-hidden="true">
          <polygon class="papeis-tras" points="338,119 1019,136 1012,780 390,780"/>
          <polygon class="papeis-frente" points="427,58 982,62 975,780 418,780"/>
        </svg>
        <img class="papeis-logo" src="/logo.png" width="125" height="79" alt="" draggable="false">
        <span class="papeis-titulo">tipos de<br>folha</span>
        <button class="papel-op" type="button" data-papel="espiral" aria-label="caderno espiral"
                style="left:460px;top:97px;width:285px;height:201px">
          <img src="/papel-miniatura-espiral.png" alt="" draggable="false">
        </button>
        <span class="papeis-subtitulo">tipo de linha</span>
        <label class="papeis-pauta">
          <input type="checkbox" id="chkPauta" checked>
          <span>pautada</span>
        </label>
        <button class="papel-op" type="button" data-papel="bege" aria-label="caderno bege"
                style="left:456px;top:305px;width:283px;height:226px">
          <img src="/papel-miniatura-bege.png" alt="" draggable="false">
        </button>
        <button class="papel-op" type="button" data-papel="padrao" aria-label="caderno cinza"
                style="left:456px;top:537px;width:305px;height:211px">
          <img src="/papel-miniatura-cinza.png" alt="" draggable="false">
        </button>
        <button class="papeis-ok" id="btnOkPapeis" type="button" aria-label="ok">ok</button>
      </div>

      <div class="painel-escrever" id="painelEscrever" role="dialog" aria-label="escrever" hidden>
        <span class="painel-titulo painel-titulo-tamanho">tamanho</span>
        <button class="painel-op" type="button" data-tamanho="titulo" style="top:31px">título</button>
        <button class="painel-op" type="button" data-tamanho="subtitulo" style="top:55px">subtítulo</button>
        <button class="painel-op" type="button" data-tamanho="texto" style="top:79px">texto</button>
        <span class="painel-titulo painel-titulo-tipo">tipo</span>
        <button class="painel-op" type="button" data-tipo="italic" style="top:170px">itálico</button>
        <button class="painel-op" type="button" data-tipo="bold" style="top:194px">negrito</button>
        <button class="painel-op" type="button" data-tipo="underline" style="top:218px">sublinhar</button>
        <button class="painel-ok" id="btnOkEscrever" type="button" aria-label="ok">ok</button>
      </div>

      <div class="adesivos-ui" id="adUi">
        <div class="adsel" id="adSel" hidden>
          <span class="adsel-haste"></span>
          <button class="adsel-alca adsel-giro" type="button" data-gesto="girar" aria-label="girar adesivo"></button>
          <button class="adsel-alca adsel-nw" type="button" data-gesto="tamanho" data-sx="-1" data-sy="-1" aria-label="redimensionar adesivo"></button>
          <button class="adsel-alca adsel-ne" type="button" data-gesto="tamanho" data-sx="1" data-sy="-1" aria-label="redimensionar adesivo"></button>
          <button class="adsel-alca adsel-se" type="button" data-gesto="tamanho" data-sx="1" data-sy="1" aria-label="redimensionar adesivo"></button>
          <button class="adsel-alca adsel-sw" type="button" data-gesto="tamanho" data-sx="-1" data-sy="1" aria-label="redimensionar adesivo"></button>
          <button class="adsel-alca adsel-corte adsel-corte-esq" type="button" data-gesto="cortar" data-lado="esq" aria-label="cortar lado esquerdo"></button>
          <button class="adsel-alca adsel-corte adsel-corte-dir" type="button" data-gesto="cortar" data-lado="dir" aria-label="cortar lado direito"></button>
          <button class="adsel-alca adsel-corte adsel-corte-cima" type="button" data-gesto="cortar" data-lado="cima" aria-label="cortar parte de cima"></button>
          <button class="adsel-alca adsel-corte adsel-corte-baixo" type="button" data-gesto="cortar" data-lado="baixo" aria-label="cortar parte de baixo"></button>
        </div>
        <div class="adbar" id="adBar" role="toolbar" aria-label="ajustes do adesivo" hidden>
          <div class="adbar-acoes">
            <button type="button" data-acao="espelhar">espelhar</button>
            <button type="button" data-acao="cortar" aria-pressed="false">cortar</button>
            <button type="button" data-acao="duplicar">duplicar</button>
            <button type="button" data-acao="frente">p/ frente</button>
            <button type="button" data-acao="tras">p/ trás</button>
          </div>
          <label class="adbar-opac">
            <span>opacidade</span>
            <input type="range" id="adOpacidade" min="0" max="100" step="1" value="100"
                   aria-label="opacidade do adesivo">
            <output id="adOpacidadeValor" for="adOpacidade">100%</output>
          </label>
        </div>
        <div class="adrec" id="adRecentes" role="group" aria-label="adesivos recentes" hidden></div>
        <button class="adesivos-ok" id="btnOkAdesivos" type="button" aria-label="ok" hidden>ok</button>
      </div>
      <input type="file" id="arqAdesivo" accept="image/png,image/jpeg,image/webp" multiple hidden>

    </div>

    <div class="anot-fundo" id="anotFundo" hidden></div>
    <div class="palco palco-anot" id="palcoAnot" hidden>
      <section class="anot" id="anot" role="dialog" aria-modal="true" aria-label="anotações">
        <img class="anot-img" src="/journal-anotacoes.png" width="722" height="665" alt="" draggable="false">
        <textarea class="anot-texto" id="anotTexto" maxlength="445" spellcheck="false"
                  placeholder="escreva aqui..." aria-label="anotações do journal"></textarea>
        <span class="anot-aviso" id="anotAviso" role="status" aria-live="polite" hidden>copiado com sucesso!</span>
        <button class="anot-btn anot-copiar" id="btnCopiar" type="button" aria-label="copiar"></button>
        <button class="anot-btn anot-ok" id="btnOk" type="button" aria-label="ok"></button>
      </section>
    </div>
  </div>

  <script src="/journal.js"></script>

<script>
  window.si = window.si || function () {
    (window.siq = window.siq || []).push(arguments);
  };
</script>

<script defer src="speed-insights.js"></script>
