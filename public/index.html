<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>cher journal</title>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="tela-entrada">
    <div class="logo">
      <img src="/logo.png" alt="cher journal">
    </div>

    <form class="entrada" id="formEntrada" autocomplete="off">
      <h1>insira a senha secreta:</h1>

      <div class="caixa-senha">
        <input id="senha" name="senha" type="password" placeholder=" " maxlength="200"
               autocomplete="current-password" aria-label="senha secreta" autofocus>
        <span class="dica" aria-hidden="true">sabia que eu mais que te gosto de você?</span>
      </div>

      <button class="botao" id="botao" type="submit">prosseguir</button>
      <p class="mensagem" id="mensagem" role="alert"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('formEntrada');
    const campo = document.getElementById('senha');
    const botao = document.getElementById('botao');
    const mensagem = document.getElementById('mensagem');

    // Se já está logado nesta sessão, vai direto para a estante.
    fetch('/api/auth/status')
      .then((r) => r.json())
      .then((d) => { if (d.autenticado) window.location.replace('/estante.html'); })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensagem.textContent = '';
      if (!campo.value) { campo.focus(); return; }

      botao.disabled = true;
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senha: campo.value }),
        });
        if (r.ok) {
          window.location.replace('/estante.html');
          return;
        }
        mensagem.textContent = r.status === 401
          ? 'senha incorreta. tente de novo.'
          : 'não foi possível entrar agora. tente de novo.';
        campo.value = '';
        campo.focus();
      } catch {
        mensagem.textContent = 'sem conexão. tente de novo.';
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
