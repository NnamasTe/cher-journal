<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal</title>
  <style>
    body { font-family: Georgia, serif; background: #f5efe6; color: #3b2f2f; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    input, button { font: inherit; padding: .5rem .7rem; margin: .25rem 0; }
    ul { padding-left: 1.1rem; }
    .erro { color: #a33; }
    .aviso { font-size: .85rem; opacity: .7; }
  </style>
</head>
<body>
  <p class="aviso">Tela provisória só para testar a base (senha + banco). O design real entra depois.</p>

  <section id="entrada" hidden>
    <h1>Entrar</h1>
    <form id="formEntrada">
      <input id="senha" type="password" placeholder="Senha do site" autocomplete="current-password" required>
      <button>Entrar</button>
    </form>
  </section>

  <section id="estante" hidden>
    <h1>Estante</h1>
    <form id="formJournal">
      <input id="titulo" placeholder="Título do novo journal" maxlength="120" required>
      <button>Criar</button>
    </form>
    <ul id="lista"></ul>
    <button id="sair">Sair</button>
  </section>

  <p id="msg" class="erro"></p>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(caminho, opcoes = {}) {
      const r = await fetch(caminho, {
        headers: { 'Content-Type': 'application/json' },
        ...opcoes,
      });
      const corpo = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(corpo.erro || 'Algo deu errado.');
      return corpo;
    }

    function mostrar(logado) {
      $('entrada').hidden = logado;
      $('estante').hidden = !logado;
      $('msg').textContent = '';
    }

    async function carregarEstante() {
      const journals = await api('/api/journals');
      $('lista').innerHTML = '';
      for (const j of journals) {
        const li = document.createElement('li');
        li.textContent = `${j.titulo} (${j.qttd_Paginas} páginas)`;
        $('lista').appendChild(li);
      }
    }

    async function iniciar() {
      const { autenticado } = await api('/api/auth/status');
      mostrar(autenticado);
      if (autenticado) await carregarEstante();
    }

    $('formEntrada').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ senha: $('senha').value }) });
        $('senha').value = '';
        await iniciar();
      } catch (err) { $('msg').textContent = err.message; }
    });

    $('formJournal').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/journals', { method: 'POST', body: JSON.stringify({ titulo: $('titulo').value }) });
        $('titulo').value = '';
        await carregarEstante();
      } catch (err) { $('msg').textContent = err.message; }
    });

    $('sair').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' });
      mostrar(false);
    });

    iniciar().catch((err) => { $('msg').textContent = err.message; });
  </script>
</body>
</html>
